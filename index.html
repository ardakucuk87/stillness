/* ─── DEBUG LOG ─────────────────────────────────────────────────
   In-app diagnostic ring-buffer. Captures every voice-pack
   lifecycle event plus console.warn/error. Surfaces as an overlay
   the user can toggle on their phone so we don't need DevTools.
   Take a screenshot of the overlay = a full bug report. */
import { jsx as _jsx, jsxs as _jsxs, Fragment as _Fragment } from "react/jsx-runtime";
const DEBUG_LOG = [];
const DEBUG_LISTENERS = new Set();
function dlog(level, ...args) {
  const msg = args.map(a => {
    if (a instanceof Error) return a.message;
    if (typeof a === "object") {
      try {
        return JSON.stringify(a).slice(0, 120);
      } catch {
        return String(a);
      }
    }
    return String(a);
  }).join(" ");
  const entry = {
    t: Date.now(),
    level,
    msg
  };
  DEBUG_LOG.push(entry);
  if (DEBUG_LOG.length > 100) DEBUG_LOG.shift();
  DEBUG_LISTENERS.forEach(l => {
    try {
      l(entry);
    } catch {}
  });
  if (typeof console !== "undefined") {
    const fn = console[level] || console.log;
    fn.call(console, "[stillness]", ...args);
  }
}
// Capture native console warnings/errors so library failures show up too.
if (typeof window !== "undefined" && !window.__stillnessConsolePatched) {

  ["warn", "error"].forEach(level => {
    const orig = console[level];
    console[level] = function (...args) {
      try {
        const entry = {
          t: Date.now(),
          level,
          msg: args.map(a => a instanceof Error ? a.message : typeof a === "object" ? "[obj]" : String(a)).join(" ")
        };
        DEBUG_LOG.push(entry);
        if (DEBUG_LOG.length > 100) DEBUG_LOG.shift();
        DEBUG_LISTENERS.forEach(l => {
          try {
            l(entry);
          } catch {}
        });
      } catch {}
      return orig.apply(this, args);
    };
  });
  window.addEventListener("error", e => {
    dlog("error", "window.error:", e.message || "(no message)");
  });
  window.addEventListener("unhandledrejection", e => {
    dlog("error", "unhandled:", e.reason?.message || String(e.reason || ""));
  });
}
function useDebugLog() {
  const [entries, setEntries] = useState(() => [...DEBUG_LOG]);
  useEffect(() => {
    const listener = () => setEntries([...DEBUG_LOG]);
    DEBUG_LISTENERS.add(listener);
    return () => DEBUG_LISTENERS.delete(listener);
  }, []);
  return entries;
}

// ─── Local storage helpers (safe-guarded for sandboxes) ────────
const safeStorage = {
  get(key, fallback) {
    try {
      if (typeof window === "undefined" || !window.localStorage) return fallback;
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      if (typeof window === "undefined" || !window.localStorage) return;
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch {
      /* noop */
    }
  }
};

// ─── IndexedDB cache for cloud TTS audio ───────────────────────
// Each MP3 is cached by a key derived from the text + voice + model so
// repeat sessions are free. The cache is opened lazily.
const TTS_DB = "stillness-tts";
const TTS_STORE = "audio";
function openTTSDB() {
  if (typeof indexedDB === "undefined") return Promise.reject(new Error("no idb"));
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(TTS_DB, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(TTS_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function ttsCacheGet(key) {
  try {
    const db = await openTTSDB();
    return await new Promise(resolve => {
      const tx = db.transaction(TTS_STORE, "readonly");
      const r = tx.objectStore(TTS_STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    });
  } catch {
    return null;
  }
}
async function ttsCachePut(key, blob) {
  try {
    const db = await openTTSDB();
    await new Promise(resolve => {
      const tx = db.transaction(TTS_STORE, "readwrite");
      tx.objectStore(TTS_STORE).put(blob, key);
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  } catch {
    /* noop */
  }
}
async function ttsCacheKey(text, voice, model) {
  const enc = new TextEncoder().encode(`${model}|${voice}|${text}`);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function usePersistedState(key, initial) {
  const [value, setValue] = useState(() => safeStorage.get(key, initial));
  useEffect(() => {
    safeStorage.set(key, value);
  }, [key, value]);
  return [value, setValue];
}
function usePrefersReducedMotion() {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    const onChange = () => setReduced(mq.matches);
    onChange();
    mq.addEventListener?.("change", onChange);
    return () => mq.removeEventListener?.("change", onChange);
  }, []);
  return reduced;
}
function useWakeLock(active) {
